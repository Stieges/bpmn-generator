    markerWidth="20" markerHeight="20" orient="auto">
    <circle cx="6" cy="6" r="3.5" fill="#ffffff" stroke="#22242a" stroke-width="1" stroke-dasharray="10000, 1"/>
  </marker>
  <!-- Message flow: open arrowhead at target -->
  <marker id="msg-end" viewBox="0 0 20 20" refX="8.5" refY="5"
    markerWidth="20" markerHeight="20" orient="auto">
    <path d="m 1 5 l 0 -3 l 7 3 l -7 3 z" fill="#ffffff" stroke="#22242a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10000, 1"/>
  </marker>
  <!-- Association: open chevron -->
  <marker id="assoc-end" viewBox="0 0 20 20" refX="11" refY="10"
    markerWidth="10" markerHeight="10" orient="auto">
    <path d="M 1 5 L 11 10 L 1 15" fill="none" stroke="#22242a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10000, 1"/>
  </marker>
</defs>
