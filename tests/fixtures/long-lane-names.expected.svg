<svg xmlns="http://www.w3.org/2000/svg" width="1212" height="694.5" viewBox="0 0 1212 694.5" font-family="Arial, sans-serif">
<defs>
  <!-- Sequence flow: filled triangle (OMG spec Fig 10.43) -->
  <marker id="seq-end" viewBox="0 0 20 20" refX="11" refY="10"
    markerWidth="10" markerHeight="10" orient="auto">
    <path d="M 1 5 L 11 10 L 1 15 Z" fill="#22242a" stroke="#22242a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <!-- Default flow: diagonal slash at source (OMG spec Fig 10.47) -->
  <marker id="seq-default-src" viewBox="0 0 20 20" refX="0" refY="10"
    markerWidth="10" markerHeight="10" orient="auto">
    <path d="M 6 4 L 10 16" fill="none" stroke="#22242a" stroke-width="2" stroke-linecap="round"/>
  </marker>
  <!-- Conditional flow: open diamond at source (OMG spec Fig 10.48) -->
  <marker id="seq-conditional-src" viewBox="0 0 20 20" refX="-1" refY="10"
    markerWidth="10" markerHeight="10" orient="auto">
    <path d="M 0 10 L 8 6 L 16 10 L 8 14 Z" fill="#ffffff" stroke="#22242a" stroke-width="2" stroke-linejoin="round"/>
  </marker>
  <!-- Message flow: open circle at source (OMG spec Fig 9.5) -->
  <marker id="msg-start" viewBox="0 0 20 20" refX="6" refY="6"
    markerWidth="20" markerHeight="20" orient="auto">
    <circle cx="6" cy="6" r="3.5" fill="#ffffff" stroke="#22242a" stroke-width="1" stroke-dasharray="10000, 1"/>
  </marker>
  <!-- Message flow: open arrowhead at target -->
  <marker id="msg-end" viewBox="0 0 20 20" refX="8.5" refY="5"
    markerWidth="20" markerHeight="20" orient="auto">
    <path d="m 1 5 l 0 -3 l 7 3 l -7 3 z" fill="#ffffff" stroke="#22242a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10000, 1"/>
  </marker>
  <!-- Association: open chevron -->
  <marker id="assoc-end" viewBox="0 0 20 20" refX="11" refY="10"
    markerWidth="10" markerHeight="10" orient="auto">
    <path d="M 1 5 L 11 10 L 1 15" fill="none" stroke="#22242a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10000, 1"/>
  </marker>
</defs>
