name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      # xmllint (libxml2-utils) is what scripts/dmn/dmn-xml.test.js needs to
      # validate generated DMN XML against the normative DMN13.xsd — without
      # it that describe block self-skips. Each matrix entry is its own
      # runner, so the install has to happen once per entry, not once per
      # workflow. No caching: a single small apt package, not worth the
      # actions/cache overhead at this size.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run tests
        working-directory: scripts
        run: npm test

      - name: Smoke test — generate BPMN + SVG
        working-directory: scripts
        run: node bpmn/pipeline.js ../tests/fixtures/simple-approval.json /tmp/smoke-test
